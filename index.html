<script>
// ─── Notifications + Service Worker ─────────────────────────────────────────
window._sendNotif = function(title, body, tag) {
  if (typeof Notification === 'undefined') return;
  if (Notification.permission === 'granted') {
    try { new Notification(title || 'FamilyMaster', { body: body||'', icon:'/icon-192.png', tag:tag||'fm', requireInteraction:true }); } catch(e) {}
  } else if (Notification.permission === 'default') {
    Notification.requestPermission().then(function(p) { if (p === 'granted') window._sendNotif(title, body, tag); });
  }
};
document.addEventListener('click', function askOnce() {
  if (Notification.permission === 'default') Notification.requestPermission();
  document.removeEventListener('click', askOnce);
}, {once:true});
// ── Service Worker (inline — try /sw.js first, then blob fallback) ──────────
var SW_CODE = [
  "self.addEventListener('install',function(e){self.skipWaiting();});",
  "self.addEventListener('activate',function(e){e.waitUntil(self.clients.claim());});",
  "self.addEventListener('push',function(e){",
  "  var d={};try{d=e.data?e.data.json():{};}catch{}",
  "  e.waitUntil(self.registration.showNotification(d.title||'FamilyMaster',{",
  "    body:d.body||'New update',icon:'/icon-192.png',badge:'/icon-192.png',",
  "    vibrate:[200,100,200],tag:d.tag||'fm',requireInteraction:true",
  "  }));",
  "});",
  "self.addEventListener('notificationclick',function(e){",
  "  e.notification.close();",
  "  e.waitUntil(clients.matchAll({type:'window'}).then(function(c){",
  "    for(var i of c){if('focus' in i)return i.focus();}",
  "    if(clients.openWindow)return clients.openWindow('/');",
  "  }));",
  "});"
].join('\n');
window._SW_CODE = SW_CODE;

function _registerSW() {
  if (!('serviceWorker' in navigator)) return;
  // Try the hosted /sw.js first (works on GitHub Pages when sw.js is uploaded alongside index.html)
  navigator.serviceWorker.register('/sw.js')
    .then(function(r){ window._swReg=r; console.log('[FM] SW ready'); })
    .catch(function() {
      // Fallback: register from URL.createObjectURL on same-origin page
      // (only works on localhost — on GitHub Pages, upload sw.js alongside index.html)
      try {
        var blob = new Blob([SW_CODE], {type:'text/javascript'});
        var url  = URL.createObjectURL(blob);
        navigator.serviceWorker.register(url)
          .then(function(r){ window._swReg=r; })
          .catch(function(e){ console.info('[FM] Push SW unavailable — in-app notifications active.'); });
      } catch(e) {}
    });
}
window.addEventListener('load', _registerSW);

// Helper: download sw.js from the app itself
window._downloadSW = function() {
  var a = document.createElement('a');
  a.href = 'data:text/javascript;charset=utf-8,' + encodeURIComponent(SW_CODE);
  a.download = 'sw.js';
  a.click();
};
</script>

<script>
// Firebase
var db=null;
function _storageKey(p){return '_s_'+p.replace(/[^a-zA-Z0-9]/g,'_');}
function _writeLocal(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){console.warn('[FM] Local save failed',e);return false;}}
function initFirebase(cfg){try{
  if(!window.firebase||!cfg||typeof cfg!=='object')return false;
  if(firebase.apps.length)firebase.app().delete();
  firebase.initializeApp(cfg);
  db=firebase.database();
  _writeLocal('fb_cfg',cfg);
  return true;
}catch(e){db=null;console.warn('[FM] Firebase unavailable; local save remains active.',e);return false;}}
(function(){try{var s=localStorage.getItem('fb_cfg');if(s)initFirebase(JSON.parse(s));}catch(e){console.warn('[FM] Saved Firebase settings could not be loaded.',e);}})();
function syncSet(p,v){
  _writeLocal(_storageKey(p),v);
  if(db)db.ref('argilan/'+p).set(v).catch(function(e){console.warn('[FM] Cloud save failed; local copy kept.',e);});
}
function syncGet(p){try{return JSON.parse(localStorage.getItem('_s_'+p.replace(/[^a-zA-Z0-9]/g,'_')));}catch(e){return null;}}

// ═══ UNIVERSAL FIREBASE SYNC ══════════════════════════════════════════════════


// Patch syncSet — track sync status AND keep rolling localStorage backup
var _originalSyncSet = syncSet;
var _backupData = (function(){
  try{ return JSON.parse(localStorage.getItem('_fm_backup')||'{}'); }catch{ return {}; }
})();
syncSet = function(p, v) {
  setSyncStatus('syncing');
  _originalSyncSet(p, v);
  // Write to rolling backup — keeps ALL data safe even if Firebase is down
  try{
    _backupData[p] = v;
    _backupData['_ts'] = Date.now();
    localStorage.setItem('_fm_backup', JSON.stringify(_backupData));
  }catch{}
  setTimeout(function() { setSyncStatus('synced'); }, 800);
};
// On startup: if Firebase is empty for a path, restore from backup
function restoreFromBackup(path){
  var v = syncGet(path);
  if(v !== null) return v; // Firebase has it
  var backed = _backupData[path];
  if(backed !== undefined) return backed;
  return null;
}

// ═══════════════════════════════════════════════════════════════════════════════

function syncOn(p,cb){var l=syncGet(p);if(l!==null)cb(l);if(db)db.ref('argilan/'+p).on('value',function(s){var v=s.val();if(v!==null){_writeLocal(_storageKey(p),v);cb(v);}});return function(){if(db)db.ref('argilan/'+p).off();};}
// window.storage polyfill
window.storage={
  get:function(k){return new Promise(function(res,rej){try{var v=localStorage.getItem('ws_'+k);if(v===null)rej(new Error('nf'));else res({key:k,value:v});}catch(e){rej(e);}});},
  set:function(k,v){return new Promise(function(res,rej){try{
    localStorage.setItem('ws_'+k,String(v));
    if(db)db.ref('argilan/ws/'+k.replace(/[^a-zA-Z0-9]/g,'_')).set(String(v)).catch(function(e){console.warn('[FM] Cloud save failed; local copy kept.',e);});
    res({key:k,value:v});
  }catch(e){rej(e);}});},
  delete:function(k){return new Promise(function(res,rej){try{localStorage.removeItem('ws_'+k);res({key:k,deleted:true});}catch(e){rej(e);}});},
  list:function(p){return new Promise(function(res,rej){try{var ks=Object.keys(localStorage).filter(function(k){return k.indexOf('ws_')===0&&(!p||k.slice(3).indexOf(p)===0);}).map(function(k){return k.slice(3);});res({keys:ks});}catch(e){rej(e);}});}
};
// Notifications
function askNotifPerm(){if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();}
function fireBrowserNotif(t,b){if('Notification'in window&&Notification.permission==='granted')try{new Notification('My Bethel — '+t,{body:b||''});}catch(e){}}
// Sound system — volume-aware
var _actx=null;
function _ctx(){if(!_actx)_actx=new(window.AudioContext||window.webkitAudioContext)();return _actx;}
function beep(f,d,v,t){
  try{
    var lv=parseInt(localStorage.getItem('alarm_vol')||'2');
    if(lv===0)return;
    var vols=[0,.08,.2,.5,1.0];
    var vol=(v||.2)*((vols[lv]||.2)/0.2);
    var c=_ctx(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type=t||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(Math.min(vol,1),c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);
    o.start(c.currentTime);o.stop(c.currentTime+d);
  }catch(e){}
}
function playSound(type){
  var lv=parseInt(localStorage.getItem('alarm_vol')||'2');
  if(lv===0)return;
  var S={
    clockIn:function(){beep(440,.08,.2);setTimeout(function(){beep(660,.18,.2)},100);},
    clockOut:function(){beep(660,.08,.2);setTimeout(function(){beep(440,.18,.2)},100);},
    notif:function(){beep(880,.06,.2);setTimeout(function(){beep(1100,.12,.2)},90);},
    alert:function(){
      var reps=lv>=4?6:3;
      for(var i=0;i<reps;i++)setTimeout(function(){beep(320,.25,.4,'square')},i*350);
      if(lv>=4&&navigator.vibrate)navigator.vibrate([300,100,300,100,500,100,500]);
    },
    payment:function(){beep(523,.08,.2);setTimeout(function(){beep(659,.08,.2)},110);setTimeout(function(){beep(784,.08,.2)},220);setTimeout(function(){beep(1047,.35,.25)},340);},
    reminder:function(){
      var reps=lv>=3?6:3;
      for(var i=0;i<reps;i++)setTimeout(function(){beep(880,.15,.2)},i*220);
      if(lv>=4&&navigator.vibrate)navigator.vibrate([200,100,200,100,400]);
    },
    success:function(){beep(523,.1,.2);setTimeout(function(){beep(784,.22,.25)},140);},
    claim:function(){beep(440,.06,.2);setTimeout(function(){beep(550,.06,.2)},80);setTimeout(function(){beep(660,.2,.2)},160);}
  };
  if(S[type])S[type]();
}
// Google Calendar
var gcalReady=false,gcalToken=null;
function initGcal(cid,cb){
  if(!window.google){cb(false,'GIS not loaded');return;}
  window._gcalClient=google.accounts.oauth2.initTokenClient({
    client_id:cid,scope:'https://www.googleapis.com/auth/calendar.events',
    callback:function(r){if(r.error){gcalReady=false;if(cb)cb(false,r.error);return;}gcalToken=r.access_token;gcalReady=true;localStorage.setItem('gcal_cid',cid);if(cb)cb(true,'');}
  });
}
function createGcalEvent(cal,ev,cb){
  if(!gcalToken){if(cb)cb(null,'not authenticated');return;}
  fetch('https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(cal)+'/events',{method:'POST',headers:{'Authorization':'Bearer '+gcalToken,'Content-Type':'application/json'},body:JSON.stringify(ev)})
    .then(function(r){return r.json();}).then(function(d){if(cb)cb(d,null);}).catch(function(e){if(cb)cb(null,e.message);});
}
// ─── Sync Status (pure JS, no React) ──────────────────────────────────────────
var _syncStatus = 'synced';
var _syncStatusListeners = [];
function setSyncStatus(s) {
  _syncStatus = s;
  _syncStatusListeners.forEach(function(fn) { try { fn(s); } catch {} });
}
// Patch syncSet to track sync status (runs before React loads, safe)
var _origSyncSet = syncSet;
syncSet = function(p, v) {
  setSyncStatus('syncing');
  _origSyncSet(p, v);
  setTimeout(function() { setSyncStatus('synced'); }, 800);
};
// Auto-sync known localStorage keys to Firebase on startup
function autoSyncLocalToFirebase() {
  var family = ['laurel','eric','ryan','kayla','ashelyn','mykah','jacob'];
  family.forEach(function(pid) {
    var v = localStorage.getItem('journal_' + pid);
    if (v && !syncGet('journals/' + pid)) {
      try { syncSet('journals/' + pid, JSON.parse(v)); } catch {}
    }
  });
  var pins = localStorage.getItem('argilan_pins');
  if (pins && !syncGet('pins')) {
    try { syncSet('pins', JSON.parse(pins)); } catch {}
  }
}
// Version check — auto-reload when new deploy detected
var _vcheckInterval = null;
function startVersionCheck() {
  if (_vcheckInterval) return;
  _vcheckInterval = setInterval(function() {
    if (!db) return;
    db.ref('argilan/app_version').once('value', function(snap) {
      var v = snap.val();
      var local = localStorage.getItem('_app_version');
      if (v && local && v !== local) {
        localStorage.setItem('_app_version', v);
        // Reload once per published version so stale cached modules are replaced.
        window.location.reload();
      } else if (v && !local) {
        localStorage.setItem('_app_version', v);
      }
    });
  }, 60000);
}
</script>
